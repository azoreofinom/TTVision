name: Build standalone apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '.github/workflows/build.yml'
      - '.python-version'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'TTVision.spec'
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'packaging/**'
      - 'images/**'
      - 'weights/**'
      - 'LICENSE'
  pull_request:
    paths:
      - '.github/workflows/build.yml'
      - '.python-version'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'TTVision.spec'
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'packaging/**'
      - 'images/**'
      - 'weights/**'
      - 'LICENSE'

permissions:
  contents: read

concurrency:
  group: standalone-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-2022
            architecture: x64
          - target: macos-arm64
            runner: macos-15
            architecture: arm64
          - target: linux-x64
            runner: ubuntu-22.04
            architecture: x64
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
      UV_PYTHON_DOWNLOADS: never
      UV_NO_PROGRESS: '1'
      UV_CACHE_DIR: ${{ runner.temp }}/uv-cache

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: '.python-version'
          architecture: ${{ matrix.architecture }}

      - name: Install pinned build environment
        run: |
          python -m pip install uv==0.9.7
          uv sync --frozen --extra build
          uv pip check

      - name: Install Linux GUI runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libgl1 libglib2.0-0 libtk8.6

      - name: Download verified FFmpeg and FFprobe
        run: uv run --frozen --extra build python scripts/fetch_ffmpeg.py --target '${{ matrix.target }}'

      - name: Run portability tests
        run: uv run --frozen --extra build python -m unittest discover -s tests -v

      - name: Test offline source inference and video export
        timeout-minutes: 5
        run: uv run --frozen --extra build python scripts/smoke_test.py

      - name: Build standalone application
        run: |
          mkdir -p build/ci
          uv run --frozen --extra build python -m PyInstaller --noconfirm --clean --workpath build/pyinstaller TTVision.spec 2>&1 | tee build/ci/pyinstaller.log

      - name: Test frozen application and create download
        timeout-minutes: 10
        run: python scripts/ci_package.py --target '${{ matrix.target }}'

      - name: Upload tested application
        uses: actions/upload-artifact@v6
        with:
          name: TTVision-${{ matrix.target }}-${{ github.run_number }}
          path: build/artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-logs-${{ matrix.target }}-${{ github.run_number }}
          path: |
            build/ci/*.log
            build/ci/*.txt
            build/pyinstaller/TTVision/warn-*.txt
          if-no-files-found: ignore
          retention-days: 14
