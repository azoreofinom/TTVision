name: Build standalone apps

on:
  workflow_dispatch:
    inputs:
      target:
        description: Platform to build
        type: choice
        required: true
        default: windows-x64
        options:
          - windows-x64
          - macos-arm64
          - linux-x64

run-name: Build ${{ inputs.target }} (${{ github.ref_name }})

permissions:
  contents: read

concurrency:
  group: standalone-${{ github.workflow }}-${{ github.ref }}-${{ inputs.target }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ inputs.target }}
    runs-on: ${{ fromJSON('{"windows-x64":"windows-2022","macos-arm64":"macos-15","linux-x64":"ubuntu-22.04"}')[inputs.target] }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
      UV_PYTHON_DOWNLOADS: never
      UV_NO_PROGRESS: '1'
      # Job-level env supports github, but not the runner context.
      UV_CACHE_DIR: ${{ github.workspace }}/build/uv-cache

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: '.python-version'
          architecture: ${{ inputs.target == 'macos-arm64' && 'arm64' || 'x64' }}

      - name: Install pinned build environment
        run: |
          python -m pip install uv==0.9.7
          uv sync --frozen --extra build
          uv pip check

      - name: Install Linux GUI runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libgl1 libglib2.0-0 libtk8.6 xvfb xauth

      - name: Download verified FFmpeg and FFprobe
        run: uv run --frozen --extra build python scripts/fetch_ffmpeg.py --target '${{ inputs.target }}'

      - name: Run portability tests
        run: uv run --frozen --extra build python -m unittest discover -s tests -v

      - name: Test offline source inference and video export
        timeout-minutes: 5
        run: uv run --frozen --extra build python scripts/smoke_test.py

      - name: Test Linux Tk image display
        if: runner.os == 'Linux'
        run: xvfb-run -a uv run --frozen --extra build python -m unittest discover -s tests -p test_tk_images.py -v

      - name: Build standalone application
        run: |
          mkdir -p build/ci
          uv run --frozen --extra build python -m PyInstaller --noconfirm --clean --workpath build/pyinstaller TTVision.spec 2>&1 | tee build/ci/pyinstaller.log

      - name: Test frozen application and create download
        timeout-minutes: 10
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a env TTVISION_TEST_GUI=1 python scripts/ci_package.py --target '${{ inputs.target }}'
          else
            python scripts/ci_package.py --target '${{ inputs.target }}'
          fi

      - name: Upload tested application
        uses: actions/upload-artifact@v6
        with:
          name: TTVision-${{ inputs.target }}-${{ github.run_number }}
          path: build/artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-logs-${{ inputs.target }}-${{ github.run_number }}
          path: |
            build/ci/*.log
            build/ci/*.txt
            build/pyinstaller/TTVision/warn-*.txt
          if-no-files-found: ignore
          retention-days: 14
