[project]
name = "ttvision"
version = "0.1.0"
description = "Table tennis video analysis and editing"
requires-python = ">=3.12,<3.13"
dependencies = [
    "setuptools==75.8.0",
    "six==1.17.0",
    "lightning==2.3.3",
    "pytorch-lightning==2.3.3",
    "torchmetrics==1.4.3",
    "opencv-contrib-python==4.11.0.86",
    "pandas==2.2.3",
    "scipy==1.15.3",
    "Pillow==12.1.1",
    "pywinstyles==1.8; sys_platform == 'win32'",
    "scikit-learn==1.7.2",
    "segmentation-models-pytorch==0.3.3",
    "Shapely==2.1.2",
    "sv-ttk==2.6.1",
    "torch==2.4.1",
    "torchvision==0.19.1",
    "numpy==1.26.4",
    "matplotlib==3.9.4",
]

[project.optional-dependencies]
build = ["pyinstaller==6.19.0", "pyinstaller-hooks-contrib==2026.3"]

[tool.uv]
package = false
environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]
